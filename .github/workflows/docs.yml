name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The API, settings and changelog pages are generated from the
          # sphinx-asr submodule and its history; revision dates need full
          # history too.
          submodules: recursive
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the wiki (strict)
        env:
          NO_MKDOCS_2_WARNING: "true"
          DISABLE_MKDOCS_2_WARNING: "true"
        run: uv run --group docs mkdocs build --strict
