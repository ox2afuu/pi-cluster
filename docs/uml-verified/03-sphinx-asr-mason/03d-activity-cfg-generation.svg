<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:943px;height:1125px;background:#FFFFFF;" width="943px" height="1125px" viewBox="0 0 943 1125" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="118.961" y="34.502" fill="#000" font-size="15" textLength="703.447" font-weight="700">sphinx-asr: how etc/sphinx_train.cfg is generated (override precedence, lowest to highest)</text></g><ellipse cx="469.685" cy="63.666" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="265.643" y="93.666" width="408.084" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="275.643" y="115.268" fill="#000" font-size="12" textLength="388.084">read vendor/sphinxtrain/etc/sphinx_train.cfg (upstream template)</text><rect x="280.443" y="147.799" width="378.482" height="62.398" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="290.443" y="169.4" fill="#000" font-size="12" textLength="358.482">replace placeholders ___DB_NAME___ = experiment dir name,</text><text x="290.443" y="183.533" fill="#000" font-size="12" textLength="344.479">___BASE_DIR___ = experiment dir, ___SPHINXTRAIN_DIR___,</text><text x="290.443" y="197.666" fill="#000" font-size="12" textLength="250.887">___SPHINXTRAIN_BIN_DIR___ = bin/&lt;arch></text><rect x="258.453" y="230.197" width="422.463" height="62.398" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="268.453" y="251.799" fill="#000" font-size="12" textLength="248.502">overrides from train.corpora[0] corpus.yml</text><text x="268.453" y="265.932" fill="#000" font-size="12" textLength="402.463">CFG_WAVFILE_EXTENSION, CFG_WAVFILE_TYPE, CFG_WAVFILE_SRATE,</text><text x="268.453" y="280.064" fill="#000" font-size="12" textLength="313.061">CFG_NUM_FILT, CFG_LO_FILT, CFG_HI_FILT, CFG_CMN</text><rect x="311.231" y="312.596" width="316.906" height="48.266" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="321.231" y="334.197" fill="#000" font-size="12" textLength="75.363">fixed globals</text><text x="321.231" y="348.33" fill="#000" font-size="12" textLength="296.906">CFG_CASEDSYMBOLS = yes, CFG_G2P_MODEL = no</text><rect x="209.258" y="380.861" width="520.854" height="62.398" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="219.258" y="402.463" fill="#000" font-size="12" textLength="32.232">paths</text><text x="219.258" y="416.596" fill="#000" font-size="12" textLength="500.854">CFG_WAVFILES_DIR = CFG_FEATFILES_DIR = DEC_CFG_FEATFILES_DIR = SPHINX_ROOT</text><text x="219.258" y="430.729" fill="#000" font-size="12" textLength="373.617">(fileids are relative to SPHINX_ROOT, .mfc sits next to the audio)</text><polygon points="103.467,463.26,278.727,463.26,290.727,475.26,278.727,487.26,103.467,487.26,91.467,475.26,103.467,463.26" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="195.097" y="497.895" fill="#000" font-size="11" textLength="17.483">yes</text><text x="103.467" y="479.795" fill="#000" font-size="12" textLength="175.26">decode.lm in experiment.yml?</text><rect x="16" y="520.215" width="350.193" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="541.816" fill="#000" font-size="12" textLength="330.193">DEC_CFG_LANGUAGEMODEL = SPHINX_ROOT/decode.lm</text><polygon points="418.989,463.26,635.505,463.26,647.505,475.26,635.505,487.26,418.989,487.26,406.989,475.26,418.989,463.26" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="531.247" y="497.895" fill="#000" font-size="11" textLength="17.483">yes</text><text x="418.989" y="479.795" fill="#000" font-size="12" textLength="216.516">corpus.yml of decode corpus has lm?</text><text x="647.505" y="472.939" fill="#000" font-size="11" textLength="26.539">none</text><rect x="386.193" y="520.215" width="282.107" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="396.193" y="541.816" fill="#000" font-size="12" textLength="262.107">DEC_CFG_LANGUAGEMODEL = corpus dir/lm</text><rect x="688.301" y="502.499" width="235.068" height="48.266" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="698.301" y="524.1" fill="#000" font-size="12" textLength="210.914">ERROR "no language model defined"</text><text x="698.301" y="538.233" fill="#000" font-size="12" textLength="215.068">(suggests sphinx lm &lt;corpus> --all)</text><ellipse cx="805.835" cy="585.348" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="805.835" cy="585.348" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="281.929" y="636.348" width="375.512" height="48.266" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="291.929" y="657.949" fill="#000" font-size="12" textLength="290.016">DEC_CFG_LISTOFFILES = etc/&lt;db>_decode.fileids</text><text x="291.929" y="672.082" fill="#000" font-size="12" textLength="355.512">DEC_CFG_TRANSCRIPTFILE = etc/&lt;db>_decode.transcription</text><rect x="303.963" y="704.613" width="331.443" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="313.963" y="726.215" fill="#000" font-size="12" textLength="311.443">experiment.yml sphinxtrain: map applied LAST (wins)</text><rect x="121.504" y="748.746" width="696.361" height="239.619" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M369.652,748.746 L369.652,755.879 L359.652,765.879 L121.504,765.879" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="124.504" y="761.348" fill="#000" font-size="12" textLength="238.148">_apply_overrides(key, value) for each key</text><rect x="270.465" y="782.879" width="398.439" height="62.398" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="280.465" y="804.48" fill="#000" font-size="12" textLength="300.832">_to_perl_value: bool -> 'yes'/'no', int/float -> bare,</text><text x="280.465" y="818.613" fill="#000" font-size="12" textLength="378.439">numeric-looking string (1e-80) -> bare, contains $ -> "double",</text><text x="280.465" y="832.746" fill="#000" font-size="12" textLength="66.92">else 'single'</text><polygon points="143.504,865.277,384.881,865.277,396.881,877.277,384.881,889.277,143.504,889.277,131.504,877.277,143.504,865.277" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="268.192" y="899.912" fill="#000" font-size="11" textLength="17.483">yes</text><text x="143.504" y="881.813" fill="#000" font-size="12" textLength="241.377">uncommented "$KEY = value" line exists?</text><rect x="171.546" y="922.232" width="185.293" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="181.546" y="943.834" fill="#000" font-size="12" textLength="165.293">replace value in every match</text><polygon points="430.499,865.277,640.353,865.277,652.353,877.277,640.353,889.277,430.499,889.277,418.499,877.277,430.499,865.277" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="539.426" y="899.912" fill="#000" font-size="11" textLength="17.483">yes</text><text x="430.499" y="881.813" fill="#000" font-size="12" textLength="209.854">commented # $KEY = ... line exists?</text><text x="652.353" y="874.957" fill="#000" font-size="11" textLength="13.583">no</text><rect x="416.881" y="922.232" width="237.09" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="426.881" y="943.834" fill="#000" font-size="12" textLength="217.09">uncomment first match and set value</text><rect x="673.971" y="918.755" width="133.895" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="683.971" y="940.356" fill="#000" font-size="12" textLength="113.895">key silently ignored</text><rect x="328.602" y="1008.365" width="282.166" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="338.602" y="1029.967" fill="#000" font-size="12" textLength="262.166">write experiments/NNN/etc/sphinx_train.cfg</text><path d="M500.685,1052.498 L500.685,1074.697 L480.685,1078.697 L500.685,1082.697 L500.685,1104.896 A0,0 0 0 0 500.685,1104.896 L744.938,1104.896 A0,0 0 0 0 744.938,1104.896 L744.938,1062.498 L734.938,1052.498 L500.685,1052.498 A0,0 0 0 0 500.685,1052.498" style="stroke:#555;stroke-width:0.5;" fill="#FFFFF0"/><path d="M734.938,1052.498 L734.938,1062.498 L744.938,1062.498 L734.938,1052.498" style="stroke:#555;stroke-width:0.5;" fill="#FFFFF0"/><text x="506.685" y="1069.1" fill="#000" font-size="12" textLength="209.93">A misspelled key under sphinxtrain:</text><text x="506.685" y="1083.232" fill="#000" font-size="12" textLength="223.254">(e.g. CFG_NTIED_STATES) produces no</text><text x="506.685" y="1097.365" fill="#000" font-size="12" textLength="156.357">error. It is simply dropped.</text><ellipse cx="469.685" cy="1078.697" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="469.685" cy="1078.697" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="469.685" y1="73.666" x2="469.685" y2="93.666" style="stroke:#000;stroke-width:1;"/><polygon points="465.685,83.666,469.685,93.666,473.685,83.666,469.685,87.666" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="469.685" y1="127.799" x2="469.685" y2="147.799" style="stroke:#000;stroke-width:1;"/><polygon points="465.685,137.799,469.685,147.799,473.685,137.799,469.685,141.799" fill="#000" style="stroke:#000;strok