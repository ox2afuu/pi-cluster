2" textLength="78.568">Queue::POSIX</text><text x="22" y="348.86" fill="#000" font-size="12" textLength="109.6">(templates default)</text></g><!--entity QPBS--><g class="entity" data-qualified-name="QPBS" id="ent0009" data-source-line="15"><rect x="196.07" y="310.196" width="145.451" height="44.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="321.521" y="315.196" width="15" height="10" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><rect x="319.521" y="317.196" width="4" height="2" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><rect x="319.521" y="321.196" width="4" height="2" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><text x="211.07" y="341.798" fill="#000" font-size="12" textLength="105.451">Queue::PBS (qsub)</text></g><!--entity QS--><g class="entity" data-qualified-name="QS" id="ent0010" data-source-line="16"><rect x="376.86" y="296.066" width="231.889" height="72.398" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="588.749" y="301.066" width="15" height="10" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><rect x="586.749" y="303.066" width="4" height="2" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><rect x="586.749" y="307.066" width="4" height="2" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><text x="391.86" y="327.668" fill="#000" font-size="12" textLength="78.674">Queue::Slurm</text><text x="391.86" y="341.8" fill="#000" font-size="12" textLength="157.236">(proposed, ~150 lines Perl,</text><text x="391.86" y="355.933" fill="#000" font-size="12" textLength="191.889">docs/uml/04-slurm-integration)</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="27"><path d="M334.08,627.726 L334.08,779.054 A0,0 0 0 0 334.08,779.054 L775.519,779.054 A0,0 0 0 0 775.519,779.054 L775.519,637.726 L765.519,627.726 L545.92,627.726 L528.37,548.956 L537.92,627.726 L334.08,627.726 A0,0 0 0 0 334.08,627.726" style="stroke:#555;stroke-width:0.5;" fill="#FFE4E1"/><path d="M765.519,627.726 L765.519,637.726 L775.519,637.726 L765.519,627.726" style="stroke:#555;stroke-width:0.5;" fill="#FFE4E1"/><text x="340.08" y="644.328" fill="#000" font-size="12" textLength="319.025">Gaps between docs and code (as of the commits read):</text><text x="340.08" y="658.46" fill="#000" font-size="12" textLength="336.891">1. No NFS server/client packages or exports in the image.</text><text x="340.08" y="672.593" fill="#000" font-size="12" textLength="376.025">2. No stage 10-sphinx-asr and no 60-sphinx-asr.yml playbook;</text><text x="351.471" y="686.726" fill="#000" font-size="12" textLength="373.5">the image does not contain sphinx-asr, wheels, or bin/aarch64.</text><text x="340.08" y="700.859" fill="#000" font-size="12" textLength="362.027">3. sphinx.sh qsub path targets missing scripts/sphinx_job.sh.</text><text x="340.08" y="714.992" fill="#000" font-size="12" textLength="420.439">4. Templates set CFG_NPART = DEC_CFG_NPART = 1 and Queue::POSIX,</text><text x="351.471" y="729.124" fill="#000" font-size="12" textLength="378.996">so even on one CM4 only one of 4 cores is used until raised to 4.</text><text x="340.08" y="743.257" fill="#000" font-size="12" textLength="316.764">5. Experiment paths are written as absolute paths into</text><text x="351.471" y="757.39" fill="#000" font-size="12" textLength="348.896">sphinx_train.cfg at setup time, so setup must run under the</text><text x="351.471" y="771.523" fill="#000" font-size="12" textLength="263.854">same SPHINX_ROOT path every node will see.</text></g><!--link RS to Q--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk11" data-source-line="18" data-link-type="dependency"><path d="M272.8,90.236 C272.8,107.406 272.8,126.596 272.8,145.376" style="stroke:#000;stroke-width:1;" fill="none" id="RS-to-Q"/><polygon points="272.8,150.376,276.8,141.376,272.8,145.376,268.8,141.376,272.8,150.376" fill="#000" style="stroke:#000;stroke-width:1;stroke-li