<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:940px;height:1027px;background:#FFFFFF;" width="940px" height="1027px" viewBox="0 0 940 1027" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="117.239" y="34.502" fill="#000" font-size="15" textLength="704.333" font-weight="700">sphinx-asr: "sphinx lm &lt;corpus> &lt;split> | --all [-n 3] [-o out]" (lm.py + CMU SLM toolkit)</text></g><ellipse cx="336.045" cy="63.666" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="267.088" y="93.666" width="137.914" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="277.088" y="115.268" fill="#000" font-size="12" textLength="117.914">load_corpus(corpus)</text><polygon points="165.856,147.799,318.435,147.799,330.435,159.799,318.435,171.799,165.856,171.799,153.856,159.799,165.856,147.799" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="246.146" y="182.434" fill="#000" font-size="11" textLength="17.483">yes</text><text x="165.856" y="164.334" fill="#000" font-size="12" textLength="152.578">split and --all both given?</text><rect x="212.851" y="203.934" width="58.59" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="222.851" y="225.535" fill="#000" font-size="12" textLength="38.59">ERROR</text><ellipse cx="242.146" cy="269.066" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="242.146" cy="269.066" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="368.69,147.799,449.978,147.799,461.978,159.799,449.978,171.799,368.69,171.799,356.69,159.799,368.69,147.799" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="413.334" y="182.434" fill="#000" font-size="11" textLength="17.483">yes</text><text x="368.69" y="164.334" fill="#000" font-size="12" textLength="81.287">neither given?</text><rect x="350.435" y="203.934" width="117.799" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="360.435" y="225.535" fill="#000" font-size="12" textLength="97.799">print help, exit 1</text><ellipse cx="409.334" cy="269.066" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="409.334" cy="269.066" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="319.788,300.066,352.302,300.066,364.302,312.066,352.302,324.066,319.788,324.066,307.788,312.066,319.788,300.066" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="319.788" y="316.602" fill="#000" font-size="12" textLength="32.514">--all?</text><text x="290.305" y="309.746" fill="#000" font-size="11" textLength="17.483">yes</text><text x="364.302" y="309.746" fill="#000" font-size="11" textLength="23.004">split</text><rect x="22.038" y="334.066" width="299.686" height="48.266" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="32.038" y="355.668" fill="#000" font-size="12" textLength="279.686">text from corpus.full_transcripts via the adapter</text><text x="32.038" y="369.801" fill="#000" font-size="12" textLength="255.047">(throwaway split cfg pointing at the full file)</text><rect x="16" y="417.332" width="311.762" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="438.934" fill="#000" font-size="12" textLength="291.762">default output corpus/&lt;name>/lm/&lt;name>.arpa</text><path d="M620.959,334.066 L620.959,391.598 L600.959,395.598 L620.959,399.598 L620.959,457.129 A0,0 0 0 0 620.959,457.129 L919.811,457.129 A0,0 0 0 0 919.811,457.129 L919.811,344.066 L909.811,334.066 L620.959,334.066 A0,0 0 0 0 620.959,334.066" style="stroke:#555;stroke-width:0.5;" fill="#FFE4E1"/><path d="M909.811,334.066 L909.811,344.066 L919.811,344.066 L909.811,334.066" style="stroke:#555;stroke-width:0.5;" fill="#FFE4E1"/><text x="626.959" y="350.668" fill="#000" font-size="12" textLength="217.951">FINDING: extract_text() is not defined</text><text x="626.959" y="364.801" fill="#000" font-size="12" textLength="234.146">(the function is extract_text_from_split).</text><text x="626.959" y="378.934" fill="#000" font-size="12" textLength="245.168">The per-split path raises NameError. --all</text><text x="626.959" y="393.066" fill="#000" font-size="12" textLength="277.852">needs full_transcripts in corpus.yml, which only</text><text x="626.959" y="407.199" fill="#000" font-size="12" textLength="202.635">switchboard defines, so today only</text><text x="626.959" y="421.332" fill="#000" font-size="12" textLength="244.084">"sphinx lm switchboard --all" works. Also</text><text x="626.959" y="435.465" fill="#000" font-size="12" textLength="251.484">idngram2lm gets no -n, so -n other than 3</text><text x="626.959" y="449.598" fill="#000" font-size="12" textLength="175.131">produces mismatched counts.</text><rect x="399.459" y="378.531" width="201.5" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="409.459" y="400.133" fill="#000" font-size="12" textLength="181.5">extract_text(corpus, split, root)</text><rect x="347.762" y="477.129" width="304.895" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="357.762" y="498.73" fill="#000" font-size="12" textLength="284.895">default output corpus/&lt;name>/lm/&lt;split>.arpa</text><polygon points="336.045,517.262,348.045,529.262,336.045,541.262,324.045,529.262,336.045,517.262" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="169.327" y="561.262" width="333.436" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="179.327" y="582.863" fill="#000" font-size="12" textLength="313.436">one "&lt;s> TEXT &lt;/s>" sentence per line, in a temp dir</text><rect x="108.157" y="605.395" width="455.775" height="242.664" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M364.872,605.395 L364.872,612.527 L354.872,622.527 L108.157,622.527" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="111.157" y="617.996" fill="#000" font-size="12" textLength="246.715">CMU-Cambridge SLM toolkit (bin/&lt;arch>)</text><rect x="221.895" y="639.527" width="228.301" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="231.895" y="661.129" fill="#000" font-size="12" textLength="208.301">text2wfreq &lt; train.txt > train.wfreq</text><rect x="207.665" y="693.66" width="256.76" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="217.665" y="715.262" fill="#000" font-size="12" textLength="236.76">wfreq2vocab &lt; train.wfreq > train.vocab</text><rect x="134.678" y="747.793" width="402.734" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="144.678" y="769.395" fill="#000" font-size="12" textLength="382.734">text2idngram -vocab train.vocab -n 3 &lt; train.txt > train.idngram</text><rect x="118.157" y="801.926" width="435.775" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="128.157" y="823.527" fill="#000" font-size="12" textLength="415.775">idngram2lm -idngram train.idngram -vocab train.vocab -arpa out.arpa</text><rect x="162.255" y="868.059" width="347.58" height="48.266" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="172.255" y="889.66" fill="#000" font-size="12" textLength="145.301">print how to reference it:</text><text x="172.255" y="903.793" fill="#000" font-size="12" textLength="327.58">corpus.yml lm: lm/&lt;file>, or experiment.yml decode.lm</text><path d="M22.881,926.324 L22.881,1006.988 A0,0 0 0 0 22.881,1006.988 L305.045,1006.988 A0,0 0 0 0 305.045,1006.988 L305.045,970.656 L325.045,966.656 L305.045,962.656 L305.045,936.324 L295.045,926.324 L22.881,926.324 A0,0 0 0 0 22.881,926.324" style="stroke:#555;stroke-width:0.5;" fill="#FFFFF0"/><path d="M295.045,926.324 L295.045,936.324 L305.045,936.324 L295.045,926.324" style="stroke:#555;stroke-width:0.5;" fill="#FFFFF0"/><text x="28.881" y="942.926" fill="#000" font-size="12" textLength="225.533">Switchboard corpus.yml already points</text><text x="28.881" y="957.059" fill="#000" font-size="12" textLength="234.023">lm: lm/switchboard.arpa, i.e. the output</text><text x="28.881" y="971.191" fill="#000" font-size="12" textLength="192.176">of "sphinx lm switchboard --all".</text><text x="28.881" y="985.324" fill="#000" font-size="12" textLength="194.033">LibriSpeech uses the downloaded</text><text x="28.881" y="999.457" fill="#000" font-size="12" textLength="261.164">3-gram.pruned.3e-7.arpa.gz from OpenSLR.</text><ellipse cx="336.045" cy="966.656" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="336.045" cy="966.656" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="336.045" y1="73.666" x2="336.045" y2="93.666" style="stroke:#000;stroke-width:1;"/><polygon points="332.045,83.666,336.045,93.666,340.045,83.666,336.045,87.666" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="242.146" y1="238.066" x2="242.146" y2="258.066" style="stroke:#000;stroke-width:1;"/><polygon points="238.146,248.066,242.146,258.066,246.146,248.066,242.146,252.066" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="409.334" y1="238.066" x2="409.334" y2="258.066" style="stroke:#000;stroke-width:1;"/><polygon points="405.334,248.066,409.334,258.066,413.334,248.066,409.334,252.066" f