nt-size="12" textLength="145.389" font-weight="700">bootfs  /boot/firmware</text><text x="16" y="238.93" fill="#000" font-size="12" textLength="491.76">cmdline.txt  += cgroup_memory=1 cgroup_enable=memory cgroup_enable=cpuset</text><text x="16" y="253.063" fill="#000" font-size="12" textLength="345.533">userconf.txt  ivalice:&lt;sha512 of FIRST_USER_PASS>  (0600)</text><text x="16" y="267.196" fill="#000" font-size="12" textLength="481.107">ivalice-node.conf.template  (NODE_ROLE, NODE_HOSTNAME, NODE_IP, NODE_K3S)</text><text x="16" y="281.329" fill="#000" font-size="12" textLength="399.234" font-style="italic">ivalice-node.conf is NOT in the image; personalize-node.sh writes it</text></g><!--entity ETC--><g class="entity" data-qualified-name="ETC" id="ent0003" data-source-line="16"><path d="M565.14,142.796 L606.14,142.796 A3.75,3.75 0 0 1 608.64,145.296 L615.64,163.796 L1044.622,163.796 A2.5,2.5 0 0 1 1047.122,166.296 L1047.122,333.757 A2.5,2.5 0 0 1 1044.622,336.257 L565.14,336.257 A2.5,2.5 0 0 1 562.64,333.757 L562.64,145.296 A2.5,2.5 0 0 1 565.14,142.796" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><line x1="562.64" y1="163.796" x2="615.64" y2="163.796" style="stroke:#000;stroke-width:0.5;"/><text x="572.64" y="182.398" fill="#000" font-size="12" textLength="204.1" font-weight="700">/etc  (files/ overlay + generated)</text><text x="572.64" y="196.53" fill="#000" font-size="12" textLength="454.482">slurm/slurm.conf  ClusterName=ivalice, ctld=dalmasca, 5 x (4 CPU, 7800 MB)</text><text x="572.64" y="210.663" fill="#000" font-size="12" textLength="288.211">munge/munge.key  (assets, 0400 munge:munge)</text><text x="572.64" y="224.796" fill="#000" font-size="12" textLength="451.764">systemd/network/10-eth0.network.template  Address=__STATIC_ADDRESS__</text><text x="572.64" y="238.929" fill="#000" font-size="12" textLength="434.379">systemd/system/ivalice-firstboot.service, ivalice-postboot-ansible.service</text><text x="572.64" y="253.062" fill="#000" font-size=