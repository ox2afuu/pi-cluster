dth="4" height="2" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><rect x="2557.367" y="178.996" width="4" height="2" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;"/><text x="2149.39" y="199.598" fill="#000" font-size="12" textLength="167.449" font-weight="700">systemd state at bake time</text><text x="2149.39" y="213.73" fill="#000" font-size="12" textLength="404.977">ENABLED: ssh, avahi-daemon, systemd-networkd, systemd-resolved,</text><text x="2183.562" y="227.863" fill="#000" font-size="12" textLength="244.934">munge, cloud-init.target, ivalice-firstboot</text><text x="2149.39" y="241.996" fill="#000" font-size="12" textLength="262.969">DISABLED: slurmctld, slurmd, k3s, k3s-agent</text><text x="2149.39" y="256.129" fill="#000" font-size="12" textLength="299.303">NOT ENABLED (left alone): ivalice-postboot-ansible</text><text x="2149.39" y="270.262" fill="#000" font-size="12" textLength="334.588">MASKED: NetworkManager, NetworkManager-wait-online</text><text x="2149.39" y="284.394" fill="#000" font-size="12" textLength="345.182">chroot assertions check: munge enabled, slurmctld/slurmd</text><text x="2149.39" y="298.527" fill="#000" font-size="12" textLength="227.783">not enabled, k3s + k3s-agent disabled</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="67"><path d="M1100.14,396.256 L1100.14,462.787 A0,0 0 0 0 1100.14,462.787 L1551.622,462.787 A0,0 0 0 0 1551.622,462.787 L1551.622,406.256 L1541.622,396.256 L1329.88,396.256 L1325.88,315.366 L1321.88,396.256 L1100.14,396.256 A0,0 0 0 0 1100.14,396.256" style="stroke:#555;stroke-width:0.5;" fill="#FFE4E1"/><path d="M1541.622,396.256 L1541.622,406.256 L1551.622,406.256 L1541.622,396.256" style="stroke:#555;stroke-width:0.5;" fill="#FFE4E1"/><text x="1106.14" y="412.858" fill="#000" font-size="12" textLength="380.906">FINDING: nothing NFS-related is installed (no nfs-kernel-server /</text><text x="1106.14" y="426.99" fill="#000" font-size="12" textLength="430.482">nfs-common in 00-packages, no export, no fstab entry), yet README and</text><text x="1106.14" y="441.123" fill="#000" font-size="12" textLength="380.215">CLAUDE.md verify steps run "mountpoint /srv/ivalice". Playbooks</text><text x="1106.14" y="455.256" fill="#000" font-size="12" textLength="365.262">55-nfs.yml and 60-sphinx-asr.yml are listed as "to be added".</text></g><!--reverse link IMG to BOOT--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="60" data-link-type="composition"><path d="M1109.598,73.189 C950.828,81.969 737.89,100.586 544.88,142.796 C497.63,153.126 447.28,189.926 402.58,205.726" style="stroke:#000;stroke-width:1;" fill="none" id="IMG-backto-BOOT" codeLine="60"/><polygon points="1121.58,72.526,1115.368,68.863,1109.598,73.189,1115.81,76.851,1121.58,72.526" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link IMG to ETC--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="61" data-link-type="composition"><path d="M1249.355,86.56 C1196.325,101.6 1131.16,120.766 1064.88,142.796 C1059.17,144.686 1053.41,167.626 1047.59,169.606" style="stroke:#000;stroke-width:1;" fill="none" id="IMG-backto-ETC" codeLine="61"/><polygon points="1260.9,83.286,1254.036,81.075,1249.355,86.56,1256.219,88.771,1260.9,83.286" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link IMG to OPT--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="62" data-link-type="composition"><path d="M1325.88,95.116 C1325.88,114.236 1325.88,154.796 1325.88,184.506" style="stroke:#000;stroke-width:1;" fill="none" id="IMG-backto-OPT" codeLine="62"/><polygon points="1325.88,83.116,1321.88,89.116,1325.88,95.116,1329.88,89.116,1325.88,83.116" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link IMG to HOME-