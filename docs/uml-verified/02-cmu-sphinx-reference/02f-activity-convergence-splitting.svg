<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1331px;height:1067px;background:#FFFFFF;" width="1331px" height="1067px" viewBox="0 0 1331 1067" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="299.828" y="34.502" fill="#000" font-size="15" textLength="730.291" font-weight="700">CMU Sphinx reference: convergence and Gaussian-splitting decision in norm_and_launchbw.pl</text></g><ellipse cx="460.55" cy="63.666" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="314.191" y="93.666" width="292.719" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="324.191" y="115.268" fill="#000" font-size="12" textLength="272.719">n_gau = CFG_INITIAL_NUM_DENSITIES, iter = 1</text><rect x="312.474" y="191.799" width="296.152" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="322.474" y="213.4" fill="#000" font-size="12" textLength="276.152">Baum-Welch over CFG_NPART parts, then norm</text><rect x="352.965" y="245.932" width="215.17" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="362.965" y="267.533" fill="#000" font-size="12" textLength="195.17">L = total likelihood / total frames</text><path d="M547.404,290.064 L547.404,398.994 L864.349,398.994 L864.349,300.064 L854.349,290.064 L547.404,290.064" style="stroke:#555;stroke-width:0.5;" fill="#FFFFF0"/><path d="M854.349,290.064 L854.349,300.064 L864.349,300.064 L854.349,290.064" style="stroke:#555;stroke-width:0.5;" fill="#FFFFF0"/><text x="553.404" y="306.666" fill="#000" font-size="12" textLength="178.096">Split rule (continuous models):</text><text x="553.404" y="320.799" fill="#000" font-size="12" textLength="275.203">if FINAL >= 2 x n_gau then add n_gau (double)</text><text x="553.404" y="334.932" fill="#000" font-size="12" textLength="139.055">else add FINAL - n_gau.</text><text x="553.404" y="349.064" fill="#000" font-size="12" textLength="258.07">After a split the new n_gau restarts at iter 0.</text><text x="553.404" y="363.197" fill="#000" font-size="12" textLength="295.945">When n_gau == FINAL: final split_gaussians with 0</text><text x="553.404" y="377.33" fill="#000" font-size="12" textLength="262.418">new components, then TRAINING COMPLETE.</text><text x="553.404" y="391.463" fill="#000" font-size="12" textLength="249.018">Semi-continuous: mk_s2sendump instead.</text><polygon points="385.697,398.994,535.404,398.994,547.404,410.994,535.404,422.994,385.697,422.994,373.697,410.994,385.697,398.994" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="385.697" y="415.529" fill="#000" font-size="12" textLength="149.707">previous norm.log exists?</text><text x="360.113" y="408.674" fill="#000" font-size="11" textLength="13.583">no</text><text x="547.404" y="408.674" fill="#000" font-size="11" textLength="17.483">yes</text><rect x="16" y="432.994" width="245.627" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="454.596" fill="#000" font-size="12" textLength="225.627">first iteration at this n_gau, just iterate</text><rect x="88.334" y="487.127" width="100.959" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="98.334" y="508.729" fill="#000" font-size="12" textLength="80.959">iter = iter + 1</text><rect x="720.941" y="432.994" width="122.691" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="730.941" y="454.596" fill="#000" font-size="12" textLength="102.691">ratio = L - L_prev</text><rect x="662.107" y="535.604" width="240.359" height="48.266" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="672.107" y="557.206" fill="#000" font-size="12" textLength="220.359">WARNING negative convergence ratio,</text><text x="672.107" y="571.339" fill="#000" font-size="12" textLength="154.025">check data and transcripts</text><polygon points="753.963,487.127,810.611,487.127,822.611,499.127,810.611,511.127,753.963,511.127,741.963,499.127,753.963,487.127" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="786.287" y="521.762" fill="#000" font-size="11" textLength="17.483">yes</text><text x="753.963" y="503.662" fill="#000" font-size="12" textLength="56.648">ratio &lt; 0?</text><polygon points="782.287,603.87,794.287,615.87,782.287,627.87,770.287,615.87,782.287,603.87" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="293.627,647.87,707.697,647.87,719.697,659.87,707.697,671.87,293.627,671.87,281.627,659.87,293.627,647.87" fill="#EEE" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="504.662" y="682.505" fill="#000" font-size="11" textLength="17.483">yes</text><text x="293.627" y="664.405" fill="#000" font-size="12" textLength="414.07">ratio > CFG_CONVERGENCE_RATIO and iter >= CFG_MAX_ITERATIONS?</text><rect x="368.096" y="704.005" width="265.133" height="48.266" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="378.096" y="725.606" fill="#000" font-size="12" textLength="157.424">stop iterating at this n_gau</text><text x="378.096" y="739.739" fill="#000" font-size="12" textLength="245.133">("Maximum desired iterations performed")</text><rect x="396.373" y="787.271" width="208.578" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="406.373" y="808.872" fill="#000" font-size="12" textLength="188.578">split Gaussians if n_gau &lt; FINAL</text><polygon points="751.697,647.87,1143.414,647.87,1155.414,659.87