<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:2349px;height:1231px;background:#FFFFFF;" width="2349px" height="1231px" viewBox="0 0 2349 1231" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="868.139" y="34.502" fill="#000" font-size="15" textLength="611.323" font-weight="700">CMU Sphinx reference: end-to-end ASR pipeline, raw corpus to word error rate</text></g><rect x="20" y="54.697" width="2302.602" height="14.133" fill="none" style="stroke:none;"/><ellipse cx="227.587" cy="83.83" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="38" y="113.83" width="379.174" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48" y="135.432" fill="#000" font-size="12" textLength="359.174">audio (wav / sph / flac) + transcripts + pronunciation lexicon</text><rect x="67.604" y="167.963" width="319.965" height="62.398" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="77.604" y="189.564" fill="#000" font-size="12" textLength="257.678">write etc/&lt;db>_train.fileids + .transcription</text><text x="77.604" y="203.697" fill="#000" font-size="12" textLength="221.73">and &lt;db>_test.fileids + .transcription</text><text x="77.604" y="217.83" fill="#000" font-size="12" textLength="299.965">(one utterance per line, "&lt;s> WORDS &lt;/s> (fileid)")</text><rect x="81.849" y="250.361" width="291.477" height="62.398" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="91.849" y="271.963" fill="#000" font-size="12" textLength="271.477">prune lexicon to the words used -> &lt;db>.dic,</text><text x="91.849" y="286.096" fill="#000" font-size="12" textLength="199.26">derive phone set -> &lt;db>.phone,</text><text x="91.849" y="300.229" fill="#000" font-size="12" textLength="204.867">noise/silence words -> &lt;db>.filler</text><rect x="26" y="332.76" width="403.174" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><line x1="20" y1="54.697" x2="20" y2="1210.283" style="stroke:#000;stroke-width:1.5;"/><rect x="439.174" y="358.76" width="338.826" height="76.531" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="449.174" y="380.361" fill="#000" font-size="12" textLength="297.744">sphinx_fe per utterance (000.comp_feat, or offline)</text><text x="449.174" y="394.494" fill="#000" font-size="12" textLength="318.826">pre-emphasis, 25.6 ms Hamming frames every 10 ms,</text><text x="449.174" y="408.627" fill="#000" font-size="12" textLength="237.803">FFT, mel filterbank (nfilt, lowerf..upperf),</text><text x="449.174" y="422.76" fill="#000" font-size="12" textLength="190.371">log, DCT -> 13 cepstra, lifter 22</text><rect x="545.442" y="470.291" width="126.289" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="555.442" y="491.893" fill="#000" font-size="12" textLength="106.289">write &lt;fileid>.mfc</text><line x1="433.174" y1="54.697" x2="433.174" y2="1210.283" style="stroke:#000;stroke-width:1.5;"/><rect x="859.136" y="379.959" width="224.568" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="869.136" y="401.561" fill="#000" font-size="12" textLength="204.568">training text, one sentence per line</text><rect x="800" y="449.092" width="342.84" height="34.133" fill="#FAFAFA" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="810" y="470.693" fill="#000" font-size="12" textLength="322.84">CMU SLM toolkit or other n-gram tool -> ARPA trigram</text><rect x="788" y="524.424" width="366.84" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><line x1="782" y1="54.697" x2="782" y2="1210.283" style="st