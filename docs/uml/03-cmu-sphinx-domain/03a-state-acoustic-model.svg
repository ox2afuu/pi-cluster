ke:#000000;stroke-width:0.5;" width="345.1074" x="93.52" y="721.2669"/><line style="stroke:#000000;stroke-width:0.5;" x1="93.52" x2="438.6274" y1="747.5638" y2="747.5638"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="151.7168" x="190.2153" y="739.262">10-11. Flat CI HMM</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="288.9844" x="98.52" y="763.7024">Context-independent HMM initialised from</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="325.1074" x="98.52" y="777.6712">flat start; force-aligned against transcripts</text></g><g class="entity" data-qualified-name="VTLN" id="ent0007"><rect fill="#FAFAFA" height="64.2344" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="298.1475" x="7" y="877.4969"/><line style="stroke:#000000;stroke-width:0.5;" x1="7" x2="305.1475" y1="903.7938" y2="903.7938"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="278.1475" x="17" y="895.492">12. VTLN warp factors per speaker</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="267.3105" x="12" y="919.9324">Vocal-tract length normalization warp</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="202.2891" x="12" y="933.9012">factor estimated per speaker</text></g><g class="entity" data-qualified-name="CIHMM_BW" id="ent0008"><rect fill="#FAFAFA" height="64.2344" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="281.29" x="124.43" y="1002.7369"/><line style="stroke:#000000;stroke-width:0.5;" x1="124.43" x2="405.72" y1="1029.0338" y2="1029.0338"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="261.29" x="134.43" y="1020.732">20. CI HMM (Baum-Welch trained)</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="245.6367" x="129.43" y="1045.1724">Context-independent HMM trained to</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="252.8613" x="129.43" y="1059.1412">convergence via forward-backward EM</text></g><g class="entity" data-qualified-name="UntiedCD" id="ent0009"><rect fill="#FAFAFA" height="64.2344" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="258.4121" x="135.87" y="1143.9669"/><line style="stroke:#000000;stroke-width:0.5;" x1="135.87" x2="394.2821" y1="1170.2638" y2="1170.2638"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="143.2881" x="193.432" y="1161.962">30. Untied CD HMM</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="140.87" y="1186.4024">Context-dependent (triphone) HMM,</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="140.87" y="1200.3712">per-state Gaussians, NOT yet tied</text></g><g class="entity" data-qualified-name="TreeBuilt" id="ent0010"><rect fill="#FAFAFA" height="64.2344" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="258.4121" x="135.87" y="1285.2069"/><line style="stroke:#000000;stroke-width:0.5;" x1="135.87" x2="394.2821" y1="1311.5038" y2="1311.5038"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="151.7168" x="189.2177" y="1303.202">40. Decision trees</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="140.87" y="1327.6424">Phonetic decision trees clustered</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="151.7168" x="140.87" y="1341.6112">over state statistics</text></g><g class="entity" data-qualified-name="TreePruned" id="ent0011"><rect fill="#FAFAFA" height="64.2344" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" widt