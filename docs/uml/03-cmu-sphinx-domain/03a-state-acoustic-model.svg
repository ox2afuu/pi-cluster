<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1883px" preserveAspectRatio="none" style="width:840px;height:1883px;background:#FFFFFF;" version="1.1" viewBox="0 0 840 1883" width="840px" zoomAndPan="magnify"><title>CMU Sphinx &#8212; acoustic model lifecycle across the 13-step pipeline</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Menlo" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="547.8662" x="139.0784" y="22.9951">CMU Sphinx &#8212; acoustic model lifecycle across the 13-step pipeline</text></g><g class="entity" data-qualified-name="Verified" id="ent0002"><rect fill="#FAFAFA" height="64.2344" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="272.8613" x="129.64" y="140.2969"/><line style="stroke:#000000;stroke-width:0.5;" x1="129.64" x2="402.5013" y1="166.5938" y2="166.5938"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="160.1455" x="185.9979" y="158.292">00. Verified corpus</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="252.8613" x="134.64" y="182.7324">fileids, transcription, dict, phone</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="173.3906" x="134.64" y="196.7012">exist and are consistent</text></g><g class="entity" data-qualified-name="Xforms" id="ent0003"><rect fill="#FAFAFA" height="94.5" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="308.9844" x="111.58" y="281.5269"/><line style="stroke:#000000;stroke-width:0.5;" x1="111.58" x2="420.5644" y1="324.1206" y2="324.1206"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="261.29" x="135.4272" y="299.522">01-02. Feature-space transforms</text><text fill="#000000" font-family="Menlo" font-size="14" lengthAdju