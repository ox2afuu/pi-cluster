spacing" textLength="260.0859" x="25.03" y="1772.6424">Merges CI and CD parameter estimates</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="25.03" y="1786.6112">to stabilise semi-continuous HMMs</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="10" id="ent0002"><ellipse cx="266.07" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="71" id="ent0016"><ellipse cx="364.07" cy="1866.4369" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="364.07" cy="1866.4369" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="75" id="ent0003"><path d="M491.13,1567.6669 L491.13,1598.9369 L456.6,1602.9369 L491.13,1606.9369 L491.13,1638.1981 A0,0 0 0 0 491.13,1638.1981 L833.0231,1638.1981 A0,0 0 0 0 833.0231,1638.1981 L833.0231,1577.6669 L823.0231,1567.6669 L491.13,1567.6669 A0,0 0 0 0 491.13,1567.6669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M823.0231,1567.6669 L823.0231,1577.6669 L833.0231,1577.6669 L823.0231,1567.6669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="203.4932" x="497.13" y="1584.7338">This is the model fed into</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="219.1465" x="497.13" y="1599.8666">pocketsphinx at decode time.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="320.8931" x="497.13" y="1614.9994">Files: means, variances, mixture_weights,</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="203.4932" x="497.13" y="1630.1322">transition_matrices, mdef.</text></g><!--link *start* to Verified--><g