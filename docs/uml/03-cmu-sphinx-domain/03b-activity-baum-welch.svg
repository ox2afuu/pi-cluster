<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="968px" preserveAspectRatio="none" style="width:1378px;height:968px;background:#FFFFFF;" version="1.1" viewBox="0 0 1378 968" width="1378px" zoomAndPan="magnify"><title>Baum-Welch EM loop (slave_convg.pl)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Menlo" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="295.0049" x="540.3125" y="32.9951">Baum-Welch EM loop (slave_convg.pl)</text></g><ellipse cx="508.4551" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="215.0645" x="400.9229" y="87.2969"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="195.0645" x="410.9229" y="108.4355">prev_likelihood = -infinity</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="57.7969" x="410.9229" y="122.4043">iter = 0</text><rect fill="none" height="148.2344" style="stroke:#000000;stroke-width:1.5;" width="1304.6299" x="36" y="200.9448"/><path d="M366.291,200.9448 L366.291,210.2417 L356.291,220.2417 L36,220.2417" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="320.291" x="39" y="214.9399">E-step (parallelised across CFG_NPART)</text><path d="M980.9102,244.3784 L980.9102,330.0425 L1330.6299,330.0425 L1330.6299,254.3784 L1320.6299,244.3784 L980.9102,244.3784" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1320.6299,244.3784 L1320.6299,254.3784 L1330.6299,254.3784 L1320.6299,244.3784" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="305.2397" x="986.9102" y="261.4453">Each partition processes a slice of the</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="313.0664" x="986.9102" y="276.5781">training utterances independently, emits</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="305.2397" x="986.9102" y="291.7109">Baum-Welch accumulators to bwaccumdir/.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="328.7197" x="986.9102" y="306.8438">Queue::* (POSIX, PBS, or new Slurm) drives</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="117.3999" x="986.9102" y="321.9766">the submission.</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="924.9102" x="46" y="237.2417"/><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="489.5996" x="58" y="263.2417"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="469.5996" x="68" y="284.3804">partition 1: forward-backward\nbaum_welch.pl 1 $iter $NPART $ngau</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="231.1875" x="68" y="298.3491">&#8594; accumulate &#947;, &#958; in bwaccumdir/</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="99.4707" x="575.5996" y="270.2261"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="79.4707" x="585.5996" y="291.3647">partition 2</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="99.4707" x="703.0703" y="270.2261"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="79.4707" x="713.0703" y="291.3647">partition i</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="128.3691" x="830.541" y="270.2261"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="108.3691" x="840.541" y="291.3647">partition NPART</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="924.9102" x="46" y="331.1792"/><rect fill="none" height="82.2656" style="stroke:#000000;stroke-width:1.5;" width="350.6582" x="333.126" y="359.1792"/><path d="M427.4131,359.1792 L427.4131,368.4761 L417.4131,378.4761 L333.126,378.4761" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="84.2871" x="336.126" y="373.1743">Accumulate</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="330.6582" x="343.126" y="395.4761"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="310.6582" x="353.126" y="416.6147">norm.pl: merge all partitions' accumulators</text><rect fill="none" height="164.1719" style="stroke:#000000;stroke-width:1.5;" width="300.0859" x="358.4121" y="451.4448"/><path d="M418.9844,451.4448 L418.9844,460.7417 L408.9844,470.7417 L358.4121,470.7417" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="361.4121" y="465.4399">M-step</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="280.0859" x="368.4121" y="487.7417"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="173.3906" x="378.4121" y="508.8804">update means, variances,</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="378.4121" y="522.8491">mixture weights, transition matrices</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="243.9629" x="386.4736" y="555.6792"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="158.9414" x="396.4736" y="576.8179">write updated model to</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="223.9629" x="396.4736" y="590.7866">model_parameters/&lt;db&gt;.cd_cont_/</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="294.5352" x="361.1875" y="635.6167"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="274.5352" x="371.1875" y="656.7554">compute log-likelihood on training set</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="222.2891" x="397.3105" y="737.9878"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="202.2891" x="407.3105" y="759.1265">prev_likelihood = likelihood</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="65.0215" x="407.3105" y="773.0952">iter += 1</text><polygon fill="#EEEEEE" points="332.9573,689.5854,683.9529,689.5854,695.9529,701.5854,683.9529,713.5854,332.9573,713.5854,320.9573,701.5854,332.9573,689.5854" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="46.3579" x="512.4551" y="723.7959">not yet</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="350.9956" x="332.9573" y="705.3936">likelihood - prev_likelihood &lt; CFG_CONVERGENCE_RATIO?</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="59.603" x="695.9529" y="698.9912">converged</text><ellipse cx="777.5559" cy="701.5854" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="777.5559" cy="701.5854" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#EEEEEE" points="422.3618,155.2344,594.5483,155.2344,606.5483,167.2344,594.5483,179.2344,422.3618,179.2344,410.3618,167.2344,422.3618,155.2344" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="19.8677" x="512.4551" y="189.4448">yes</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="172.1865" x="422.3618" y="171.0425">iter &lt; CFG_MAX_ITERATIONS?</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="125.8286" x="284.5332" y="164.6401">too many iterations</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="265.6367" x="375.6367" y="827.9253"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="245.6367" x="385.6367" y="849.064">stop with warning (no convergence)</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="385.6367" y="863.0327">log "Aborting &#8212; did not converge"</text><path d="M539.4551,885.8628 L539.4551,917.1284 L519.4551,921.1284 L539.4551,925.1284 L539.4551,956.394 A0,0 0 0 0 539.4551,956.394 L865.6948,956.394 A0,0 0 0 0 865.6948,956.394 L865.6948,895.8628 L855.6948,885.8628 L539.4551,885.8628 A0,0 0 0 0 539.4551,885.8628" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M855.6948,885.8628 L855.6948,895.8628 L865.6948,895.8628 L855.6948,885.8628" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="242.6265" x="545.4551" y="902.9297">Convergence is the normal exit.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="545.4551" y="918.0625">Max-iterations exit is a safety net;</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="289.5864" x="545.4551" y="933.1953">indicates badly configured parameters</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="305.2397" x="545.4551" y="948.3281">(too many tied states, bad init, etc.).</text><ellipse cx="508.4551" cy="921.1284" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="508.4551" cy="921.1284" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="508.4551" x2="508.4551" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="504.4551,77.2969,508.4551,87.2969,512.4551,77.2969,508.4551,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="302.7998" x2="302.7998" y1="243.2417" y2="263.2417"/><polygon fill="#181818" points="298.7998,253.2417,302.7998,263.2417,306.7998,253.2417,302.7998,257.2417" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="625.335" x2="625.335" y1="243.2417" y2="270.2261"/><polygon fill="#181818" points="621.335,260.2261,625.335,270.2261,629.335,260.2261,625.335,264.2261" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="752.8057" x2="752.8057" y1="243.2417" y2="270.2261"/><polygon fill="#181818" points="748.8057,260.2261,752.8057,270.2261,756.8057,260.2261,752.8057,264.2261" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="894.7256" x2="894.7256" y1="243.2417" y2="270.2261"/><polygon fill="#181818" points="890.7256,260.2261,894.7256,270.2261,898.7256,260.2261,894.7256,264.2261" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="302.7998" x2="302.7998" y1="311.1792" y2="331.1792"/><polygon fill="#181818" points="298.7998,321.1792,302.7998,331.1792,306.7998,321.1