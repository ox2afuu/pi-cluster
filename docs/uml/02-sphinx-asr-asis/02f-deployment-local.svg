 Sox--><g class="entity" data-qualified-name="OS-level tools.Sox" data-source-line="23" id="ent0016"><path d="M1577.36,525.1969 L1577.36,556.4938 A2.5,2.5 0 0 0 1579.86,558.9938 L1620.1461,558.9938 A2.5,2.5 0 0 0 1622.6461,556.4938 L1622.6461,532.6969 L1612.6461,522.6969 L1579.86,522.6969 A2.5,2.5 0 0 0 1577.36,525.1969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1612.6461,522.6969 L1612.6461,530.1969 A2.5,2.5 0 0 0 1615.1461,532.6969 L1622.6461,532.6969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="25.2861" x="1587.36" y="545.692">sox</text></g><!--entity Toolchain--><g class="entity" data-qualified-name="OS-level tools.Toolchain" data-source-line="24" id="ent0017"><path d="M1298.57,525.1969 L1298.57,556.4938 A2.5,2.5 0 0 0 1301.07,558.9938 L1450.9294,558.9938 A2.5,2.5 0 0 0 1453.4294,556.4938 L1453.4294,532.6969 L1443.4294,522.6969 L1301.07,522.6969 A2.5,2.5 0 0 0 1298.57,525.1969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1443.4294,522.6969 L1443.4294,530.1969 A2.5,2.5 0 0 0 1445.9294,532.6969 L1453.4294,532.6969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="1308.57" y="545.692">make, gcc, cmake</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="39" id="ent0029"><path d="M1771.49,490.4469 L1771.49,591.2438 L2152.5164,591.2438 L2152.5164,500.4469 L2142.5164,490.4469 L1771.49,490.4469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2142.5164,490.4469 L2142.5164,500.4469 L2152.5164,500.4469 L2142.5164,490.4469" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.2266" x="1777.49" y="507.5138">All state local.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="164.3599" x="1910.5432" y="507.5138">Training's Baum-Welch</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="336.5464" x="1777.49" y="522.6466">accumulator passes, decoder partitions, and</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="336.5464" x="1777.49" y="537.7794">logs all live on the same filesystem as the</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="360.0264" x="1777.49" y="552.9122">Python / Perl / C processes that produce them.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="7.8267" x="1777.49" y="568.045">&#160;</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="320.8931" x="1777.49" y="583.1778">No Slurm, no NFS, no cross-host anything.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="48" id="ent0032"><path d="M1274.66,165.3269 L1274.66,235.8581 L1671.3397,235.8581 L1671.3397,175.3269 L1661.3397,165.3269 L1274.66,165.3269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1661.3397,165.3269 L1661.3397,175.3269 L1671.3397,175.3269 L1661.3397,165.3269" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="180.0132" x="1280.66" y="182.3938">Parallelism limited to:</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="375.6797" x="1280.66" y="197.5266">- feats.py ThreadPoolExecutor across local cores</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="328.7197" x="1280.66" y="212.6594">- Queue::POSIX fork-pool inside slave_*.pl</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="250.4531" x="1296.3133" y="227.7922">(capped by CFG_NPART, default 1)</text></g><!--link Entry to Venv--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" data-source-line="27" id="lnk18"><path d="M606.09,211.4169 C569.33,220.1569 523.8,236.3269 493,265.8569 C477.43,280.7869 470.2226,298.1259 465.5226,315.9159" fill="none" id="Entry-to-Venv" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="463.99,321.7169,470.1562,314.0371,465.2671,316.8827,462.4216,311.9937,463.99,321.7169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="164.3599" x="494" y="278.9238">creates + pip install</text></g><!--link Entry to Scripts--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" data-source-line="28" id="lnk19"><path d="M667,227.2769 C667,250.9469 667,294.8319 667,321.0019" fill="none" id="Entry-to-Scripts" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="667,327.0019,671,318.0019,667,322.0019,663,318.0019,667,327.0019" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="187.8398" x="668" y="278.9238">python3 scripts/&lt;cmd&gt;.py</text></g><!--link Entry to Bin--><g class="link" data-entity-1="ent0004" data-entity-2="ent0010" data-link-type="dependency" data-source-line="29" id="lnk20"><path d="M728.05,220.8369 C797.28,242.7369 913.45,279.7869 1013,312.8569 C1018.57,314.7069 1018.6348,314.7189 1024.4148,316.6689" fill="none" id="Entry-to-Bin" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1030.1,318.5869,1022.8509,311.9197,1025.3624,316.9885,1020.2936,319.5,1030.1,318.5869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="180.0132" x="919.15" y="278.9238">PATH prepend bin/&lt;arch&gt;</text></g><!--link Mk to V