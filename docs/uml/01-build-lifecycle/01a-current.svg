"592.084">read operator pubkey (IVALICE_PUBKEY_PATH</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="187.8398" x="103.5723" y="606.0527">or /.ssh/headnode-key.pub)</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="178.9414" x="162.2061" y="687.2852"/><text fill="#000000" font-family="Menlo" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="28.8984" x="172.2061" y="708.4238">FAIL</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="122.8184" x="208.3291" y="708.4238">&#8212; refuse to build</text><ellipse cx="251.6768" cy="760.7695" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="251.6768" cy="760.7695" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#EEEEEE" points="202.0076,638.8828,301.3459,638.8828,313.3459,650.8828,301.3459,662.8828,202.0076,662.8828,190.0076,650.8828,202.0076,638.8828" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="19.8677" x="255.6768" y="673.0933">yes</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="99.3384" x="202.0076" y="654.6909">pubkey missing?</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="13.2451" x="313.3459" y="648.2886">no</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="388.4551" x="57.4492" y="813.7695"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="368.4551" x="67.4492" y="834.9082">concat operator pubkey + assets/ivalice-cluster.pub</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="28.8984" x="67.4492" y="848.877">into</text><text fill="#000000" font-family="Menlo" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="151.7168" x="103.5723" y="848.877">PUBKEY_SSH_FIRST_USER</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="50.5723" x="262.5137" y="848.877">env var</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="337.8828" x="82.7354" y="893.707"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="317.8828" x="92.7354" y="914.8457">touch pi-gen/stage{3,4,5}/SKIP + SKIP_IMAGES</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="216.7383" x="92.7354" y="928.8145">(skip upstream desktop stages)</text><rect fill="none" height="662.7188" style="stroke:#000000;stroke-width:1.5;" width="721.9082" x="11" y="951.6445"/><path d="M273.8613,951.6445 L273.8613,960.9414 L263.8613,970.9414 L11,970.9414" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="252.8613" x="14" y="965.6396">run_pigen(configs/config.base)</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="366.7813" x="68.2861" y="987.9414"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="173.3906" x="78.2861" y="1009.0801">require_podman_machine()</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="346.7813" x="78.2861" y="1023.0488">&#8212; podman installed, responsive, rootful on macOS</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="374.0059" x="64.6738" y="1055.8789"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="195.0645" x="74.6738" y="1077.0176">ensure_clean_podman_state()</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="354.0059" x="74.6738" y="1090.9863">&#8212; clear stale (lost)/(deleted) loop devices in VM</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="359.5566" x="71.8984" y="1123.8164"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="216.7383" x="81.8984" y="1144.9551">patch_pigen_losetup_sanitize()</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="339.5566" x="81.8984" y="1158.9238">&#8212; sed pi-gen/scripts/common for util-linux 2.41</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="280.0859" x="111.6338" y="1191.7539"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="158.9414" x="121.6338" y="1212.8926">podman build -t pi-gen</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="121.6338" y="1226.8613">--build-arg BASE_IMAGE=debian:trixie</text><path d="M404.4951,1249.6914 L404.4951,1296.0898 L384.4951,1300.0898 L404.4951,1304.0898 L404.4951,1350.4883 A0,0 0 0 0 404.4951,1350.4883 L722.9082,1350.4883 A0,0 0 0 0 722.9082,1350.4883 L722.9082,1259.6914 L712.9082,1249.6914 L404.4951,1249.6914 A0,0 0 0 0 404.4951,1249.6914" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M712.9082,1249.6914 L712.9082,1259.6914 L722.9082,1259.6914 L712.9082,1249.6914" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="133.0532" x="410.4951" y="1266.7583">Inside container:</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="410.4951" y="1281.8911">1. dpkg-reconfigure qemu-user-binfmt</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="156.5332" x="410.4951" y="1297.0239">2. mount binfmt_misc</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="203.4932" x="410.4951" y="1312.1567">3. final-pass loop cleanup</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="297.4131" x="410.4951" y="1327.2896">4. cd /pi-gen &amp;&amp; ./build.sh -c /config</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="258.2798" x="410.4951" y="1342.4224">5. rsync work/*/build.log deploy/</text><rect fill="#FAFAFA" height="61.9063" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="265.6367" x="118.8584" y="1269.1367"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="166.166" x="128.8584" y="1290.2754">podman run --privileged</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="231.1875" x="128.8584" y="1304.2441">--volume /config,/stages,/assets</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="245.6367" x="128.8584" y="1318.2129">-e GIT_HASH, PUBKEY_SSH_FIRST_USER</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="388.4551" x="57.4492" y="1370.4883"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="368.4551" x="67.4492" y="1391.627">podman cp container:/pi-gen/deploy/. &#8594; host deploy/</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="323.4336" x="89.96" y="1424.457"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="303.4336" x="99.96" y="1445.5957">podman logs &#8594; pi-gen/logs/build-podman.log</text><polygon fill="#EEEEEE" points="166.2061,1478.4258,337.1475,1478.4258,349.1475,1490.4258,337.1475,1502.4258,166.2061,1502.425