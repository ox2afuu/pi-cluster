 y="563.1638">clear stale loops</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="295.29" y="578.2966">(ssh + losetup -d)</text></g><!--link RP to P--><g class="link" data-entity-1="ent0019" data-entity-2="ent0021" data-link-type="dependency" data-source-line="52" id="lnk34"><path d="M262.35,549.6569 C273.12,547.0769 283.89,544.6169 294.29,542.3969 C378.9,524.3369 472.8523,509.7395 529.2923,501.5395" fill="none" id="RP-to-P" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="535.23,500.6769,525.7484,498.0124,530.2819,501.3958,526.8986,505.9293,535.23,500.6769" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="93.9199" x="318.79" y="497.3938">podman build</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="78.2666" x="326.6167" y="512.5266">podman run</text></g><!--link P to ContainerP--><g class="link" data-entity-1="ent0021" data-entity-2="ent0022" data-link-type="dependency" data-source-line="53" id="lnk35"><path d="M626.54,495.0069 C650.5525,495.3344 682.2238,495.7662 716.3298,496.2314 C733.3829,496.464 751.0446,496.7049 768.6621,496.9452 C773.0665,497.0053 777.4681,497.0653 781.8567,497.1252 C784.0511,497.1552 780.2427,497.1032 782.4292,497.133" fill="none" id="P-to-ContainerP" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="788.4287,497.2149,779.4841,493.0925,783.4291,497.1467,779.3749,501.0917,788.4287,497.2149" style="stroke:#181818;stroke-width:1;"/></g><!--link ContainerP to PiGen--><g class="link" data-entity-1="ent0022" data-entity-2="ent0009" data-link-type="dependency" data-source-line="54" id="lnk36"><path d="M1060.1491,456.3593 C1072.1103,451.9192 1084.5526,447.3841 1097.2086,442.8861 C1122.5206,433.89 1148.6875,425.0419 1173.57,417.3969 C1274.1,386.5169 1385.2688,359.5849 1466.1188,341.2349" fill="none" id="ContainerP-to-Pi