sed..DD" data-source-line="25" id="ent0013"><rect fill="#FAFAFA" height="46.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="149.5732" x="874.36" y="836.2469"/><rect fill="#FAFAFA" height="10" style="stroke:#000000;stroke-width:0.5;" width="15" x="1003.9332" y="841.2469"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="1001.9332" y="843.2469"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="1001.9332" y="847.2469"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="109.5732" x="889.36" y="869.242">Docker daemon</text></g><g class="entity" data-qualified-name="Stock Docker path .NOT used..ContainerD.GMN15" data-source-line="27" id="ent0016"><path d="M1463.36,894.2669 L1463.36,934.5325 L1680.0265,934.5325 L1680.0265,904.2669 L1670.0265,894.2669 L1463.36,894.2669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1670.0265,894.2669 L1670.0265,904.2669 L1680.0265,904.2669 L1670.0265,894.2669" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="1469.36" y="911.3338">bind: /config only</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="195.6665" x="1469.36" y="926.4666">missing: /stages, /assets</text></g><!--entity RP--><g class="entity" data-qualified-name="ivaliceCluster Podman path .current..RP" data-source-line="32" id="ent0019"><rect fill="#FAFAFA" height="62.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="242.2891" x="22" y="550.0969"/><rect fill="#FAFAFA" height="10" style="stroke:#000000;stroke-width:0.5;" width="15" x="244.2891" y="555.0969"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="242.2891" y="557.0969"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="242.2891" y="561.0969"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="202.2891" x="37" y="583.092">scripts/_pigen-podman.sh</text><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="92.7158" x="37" y="599.3889">run_pigen()</text></g><!--entity VM--><g class="entity" data-qualified-name="ivaliceCluster Podman path .current..VM" data-source-line="33" id="ent0020"><rect fill="#FAFAFA" height="62.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="183.2881" x="489.36" y="552.0969"/><rect fill="#FAFAFA" height="10" style="stroke:#000000;stroke-width:0.5;" width="15" x="652.6481" y="557.0969"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="650.6481" y="559.0969"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="650.6481" y="563.0969"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="143.2881" x="504.36" y="585.092">podman-machine VM</text><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="59.001" x="504.36" y="601.3889">(macOS)</text></g><!--entity P--><g class="entity" data-qualified-name="ivaliceCluster Podman path .current..P" data-source-line="34" id="ent0021"><rect fill="#FAFAFA" height="46.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="90.5723" x="535.72" y="471.2469"/><rect fill="#FAFAFA" height="10" style="stroke:#000000;stroke-width:0.5;" width="15" x="606.2923" y="476.2469"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="604.2923" y="478.2469"/><rect fill="#FAFAFA" height="2" style="stroke:#000000;stroke-width:0.5;" width="4" x="604.2923" y="482.2469"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="550.72" y="504.242">podman</text></g><g class="entity" data-qualified-name="ivaliceCluster Podman path .current..ContainerP.GMN23" data-source-line="36" id="ent0024"><path d="M813.42,534.2669 L813.42,574.5325 L1084.8731,574.5325 L1084.8731,544.2669 L1074.8731,534.2669 L813.42,534.2669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1074.8731,534.2669 L1074.8731,544.2669 L1084.8731,544.2669 L1074.8731,534.2669" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="819.42" y="551.3338">bind: /config, /stages, /assets</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="250.4531" x="819.42" y="566.4666">full ivaliceCluster tree visible</text></g><g class="entity" data-qualified-name="GMN40" data-source-line="60" id="ent0041"><path d="M754.72,1006.4369 L754.72,1122.3666 L1143.573,1122.3666 L1143.573,1016.4369 L1133.573,1006.4369 L754.72,1006.4369" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1133.573,1006.4369 L1133.573,1016.4369 L1143.573,1016.4369 L1133.573,1006.4369" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="281.7598" x="760.72" y="1023.5038">Why stock Docker path is unsuitable:</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="352.1997" x="760.72" y="1038.6366">1. build-docker.sh's "rootless" grep misfires</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="219.1465" x="784.2" y="1053.7694">against rootful podman info.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="367.853" x="760.72" y="1068.9022">2. Only bind-mounts the config file; our stages</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="250.4531" x="784.2" y="1084.035">and assets live outside pi-gen/.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="352.1997" x="760.72" y="1099.1678">3. No hook to clear podman-machine stale loop</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="344.373" x="784.2" y="1114.3006">devices or patch util-linux 2.41 losetup -f.</text></g><g class="entity" data-qualified-name="GMN43" data-source-line="70" id="ent0044"><path d="M1408.57,43.2969 L1408.57,189.4922 L1734.8097,189.4922 L1734.8097,53.2969 L1724.8097,43.2969 L1408.57,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1724.8097,43.2969 L1724.8097,53.2969 L1734.8097,53.2969 L1724.8097,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="172.1865" x="1414.57" y="60.3638">Why Podman path works:</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="1414.57" y="75.4966">- Three bind mounts expose the whole</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="156.5332" x="1430.2233" y="90.6294">ivaliceCluster tree.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="289.5864" x="1414.57" y="105.7622">- Helper script enforces rootful mode</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="258.2798" x="1430.2233" y="120.895">on macOS and cleans the VM kernel</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="148.7065" x="1430.2233" y="136.0278">state before build.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="305.2397" x="1414.57" y="151.1606">- Patches pi-gen/scripts/common for the</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="289.5864" x="1430.2233" y="166.2935">util-linux 2.41 losetup -f annotation</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="266.1064" x="1430.2233" y="181.4263">before `podman build` bakes it in.</text></g><!--link GMN15 to ContainerD--><g class="link" data-entity-1="ent0016" data-entity-2="ent0014" data-link-type="association" data-source-line="27" id="lnk17"><path d="M1571.69,893.7769 C1571.69,882.5869 1571.69,871.3969 1571.69,860.2069" fill="none" id="GMN15-ContainerD" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link GMN23 to ContainerP--><g class="link" data-entity-1="ent0024" data-entity-2="ent0022" data-link-type="association" data-source-line="36" id="lnk25"><path d="M949.15,533.7769 C949.15,522.5869 949.15,511.3969 949.15,500.2069" fill="none" id="GMN23-ContainerP" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link Build to Helper--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="40" id="lnk26"><path d="M1659.31,678.3969 C1700.53,678.3969 1744.49,678.3969 1789.34,678.3969" fill="none" id="Build-to-Helper" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1795.34,678.3969,1786.34,674.3969,1790.34,678.3969,1786.34,682.3969,1795.34,678.3969" style="stroke:#181818;stroke-width:1;"/></g><!--link Build to Config--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="41" id="lnk27"><path d="M1659.43,658.2269 C1686.53,651.9069 1716.53,644.8869 1744.03,638.3969 C1767.77,632.7969 1787.5137,628.109 1811.4937,622.389" fill="none" id="Build-to-Config" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1817.33,620.9969,1807.6475,619.1942,1812.4664,622.157,1809.5037,626.9759,1817.33,620.9969" style="stroke:#181818;stroke-width:1;"/></g><!--link Helper to RP--><g class="link" data-entity-1="ent0005" data-entity