"participant participant-head" data-entity-uid="part4" data-qualified-name="Container" id="part4-head"><rect fill="#F8F8F8" height="46.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="148.8594" x="784.3379" y="71"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="791.3379" y="90.9951">pi-gen container</text><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="795.5522" y="107.292">(debian:trixie)</text></g><g class="participant participant-tail" data-entity-uid="part4" data-qualified-name="Container" id="part4-tail"><rect fill="#F8F8F8" height="46.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="148.8594" x="784.3379" y="1100.5078"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="791.3379" y="1120.5029">pi-gen container</text><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="795.5522" y="1136.7998">(debian:trixie)</text></g><g class="participant participant-head" data-entity-uid="part5" data-qualified-name="Deploy" id="part5-head"><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="118.002" x="1136.0063" y="115.292">pi-gen/deploy/</text><path d="M1180.0073,66.2969 C1180.0073,56.2969 1198.0073,56.2969 1198.0073,56.2969 C1198.0073,56.2969 1216.0073,56.2969 1216.0073,66.2969 L1216.0073,92.2969 C1216.0073,102.2969 1198.0073,102.2969 1198.0073,102.2969 C1198.0073,102.2969 1180.0073,102.2969 1180.0073,92.2969 L1180.0073,66.2969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M1180.0073,66.2969 C1180.0073,76.2969 1198.0073,76.2969 1198.0073,76.2969 C1198.0073,76.2969 1216.0073,76.2969 1216.0073,66.2969" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-tail" data-entity-uid="part5" data-qualified-name="Deploy" id="part5-tail"><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="118.002" x="1136.0063" y="1113.5029">pi-gen/deploy/</text><path d="M1180.0073,1126.8047 C1180.0073,1116.8047 1198.0073,1116.8047 1198.0073,1116.8047 C1198.0073,1116.8047 1216.0073,1116.8047 1216.0073,1126.8047 L1216.0073,1152.8047 C1216.0073,1162.8047 1198.0073,1162.8047 1198.0073,1162.8047 C1198.0073,1162.8047 1180.0073,1162.8047 1180.0073,1152.8047 L1180.0073,1126.8047" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M1180.0073,1126.8047 C1180.0073,1136.8047 1198.0073,1136.8047 1198.0073,1136.8047 C1198.0073,1136.8047 1216.0073,1136.8047 1216.0073,1126.8047" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g><title>build-docker.sh</title><rect fill="#FFFFFF" height="853.25" style="stroke:#181818;stroke-width:1;" width="10" x="282.0347" y="230.2578"/></g><g><title>Docker daemon</title><rect fill="#FFFFFF" height="86.3984" style="stroke:#181818;stroke-width:1;" width="10" x="647.5811" y="412.3203"/></g><g><title>Docker daemon</title><rect fill="#FFFFFF" height="408.8594" style="stroke:#181818;stroke-width:1;" width="10" x="647.5811" y="558.1172"/></g><g><title>Docker daemon</title><rect fill="#FFFFFF" height="29.1328" style="stroke:#181818;stroke-width:1;" width="10" x="647.5811" y="996.1094"/></g><g><title>pi-gen container</title><rect fill="#FFFFFF" height="254.9297" style="stroke:#181818;stroke-width:1;" width="10" x="853.7676" y="682.9141"/></g><path d="M5,133.5938 L5,203.5938 L1245,203.5938 L1245,143.5938 L1235,133.5938 L5,133.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1235,133.5938 L1235,143.5938 L1245,143.5938 L1235,133.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="516.5596" x="354.3977" y="150.6606">Provided as reference only. Upstream pi-gen's default way to build</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="532.2129" x="354.3977" y="165.7935">on a machine with Docker. It does NOT satisfy ivaliceCluster's needs</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="477.4263" x="354.3977" y="180.9263">(see "why it doesn't work for us" notes), which is why we use</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="258.2798" x="354.3977" y="196.0591">scripts/_pigen-podman.sh instead.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#000000" points="270.0347,226.2578,280.0347,230.2578,270.0347,234.2578,274.0347,230.2578" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="51.7148" x2="276.0347" y1="230.2578" y2="230.2578"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="211.3198" x="58.7148" y="225.1919">./build-docker.sh -c config</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg2"><line style="stroke:#000000;stroke-width:1;" x1="292.0347" x2="334.0347" y1="274.5234" y2="274.5234"/><line style="stroke:#000000;stroke-width:1;" x1="334.0347" x2="334.0347" y1="274.5234" y2="287.5234"/><line style="stroke:#000000;stroke-width:1;" x1="293.0347" x2="334.0347" y1="287.5234" y2="287.5234"/><polygon fill="#000000" points="303.0347,283.5234,293.0347,287.5234,303.0347,291.5234,299.0347,287.5234" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="125.2266" x="299.0347" y="254.3247">check for podman</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="273.9331" x="299.0347" y="269.4575">(grep `podman info` for "rootless")</text></g><path d="M297,300.5234 L297,385.5234 L591,385.5234 L591,310.5234 L581,300.5234 L297,300.5234" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M581,300.5234 L581,310.5234 L591,310.5234 L581,300.5234" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.2666" x="303" y="317.5903">Fragile #1</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="164.3599" x="381.2666" y="317.5903">: even rootful podman</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="273.9331" x="303" y="332.7231">emits "rootless" somewhere in info,</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="266.1064" x="303" y="347.856">so the script mistakenly thinks it</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="303" y="362.9888">has to prepend `sudo`, breaking</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="273.9331" x="303" y="378.1216">rootful-machine workflows on macOS.</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3"><polygon fill="#000000" points="635.5811,408.3203,645.5811,412.3203,635.5811,416.3203,639.5811,412.3203" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="292.0347" x2="641.5811" y1="412.3203" y2="412.3203"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="187.8398" x="299.0347" y="407.2544">docker build -t pi-gen .</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg4"><line style="stroke:#000000;stroke-width:1;" x1="657.5811" x2="699.5811" y1="456.5859" y2="456.5859"/><line style="stroke:#000000;stroke-width:1;" x1="699.5811" x2="699.5811" y1="456.5859" y2="469.5859"/><line style="stroke:#000000;stroke-width:1;" x1="658.5811" x2="699.5811" y1="469.5859" y2="469.5859"/><polygon fill="#000000" points="668.5811,465.5859,658.5811,469.5859,668.5811,473.5859,664.5811,469.5859" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="164.3599" x="664.5811" y="436.3872">build container image</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="172.1865" x="664.5811" y="451.52">from pi-gen/Dockerfile</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg5"><polygon fill="#000000" points="303.0347,494.7188,293.0347,498.7188,303.0347,502.7188,299.0347,498.7188" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="297.0347" x2="651.5811" y1="498.7188" y2="498.7188"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="93.9199" x="309.0347" y="493.6528">image tagged</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg6"><polygon fill="#000000" points="635.5811,554.1172,645.5811,558.1172,635.5811,562.1172,639.5811,558.1172" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="292.0347" x2="641.5811" y1="558.1172" y2="558.1172"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="180.0132" x="299.0347" y="522.7856">docker run --privileged</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="314.688" y="537.9185">-v /config:/config</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="156.5332" x="314.688" y="553.0513">pi-gen bash -c '...'</text></g><path d="M297,571.1172 L297,656.1172 L670,656.1172 L670,581.1172 L660,571.1172 L297,571.1172" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M660,571.1172 L660,581.1172 L670,581.1172 L660,571.1172" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.2666" x="303" y="588.1841">Fragile #2</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="78.2666" x="381.2666" y="588.1841">: only the</text><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.0933" x="467.3599" y="588.1841">config file</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="15.6533" x="561.2798" y="588.1841">is</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="328.7197" x="303" y="603.3169">bind-mounted. ivaliceCluster's stages live</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="313.0664" x="303" y="618.4497">under ../stages/ and airgap assets under</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="352.1997" x="303" y="633.5825">../assets/ &#8212; neither is visible to the build,</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="336.5464" x="303" y="648.7153">so STAGE_LIST=../stages/... cannot resolve.</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg7"><polygon fill="#000000" points="841.7676,678.9141,851.7676,682.9141,841.7676,686.9141,845.7676,682.9141" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="657.5811" x2="847.7676" y1="682.9141" y2="682.9141"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="39.1333" x="664.5811" y="677.8481">start</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg8"><line style="stroke:#000000;stroke-width:1;" x1="863.7676" x2="905.7676" y1="712.0469" y2="712.0469"/><line style="stroke:#000000;stroke-width:1;" x1="905.7676" x2="905.7676" y1="712.0469" y2="725.0469"/><line style="stroke:#000000;stroke-width:1;" x1="864.7676" x2="905.7676" y1="725.0469" y2="725.0469"/><polygon fill="#000000" points="874.7676,721.0469,864.7676,725.0469,874.7676,729.0469,870.7676,725.0469" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="258.2798" x="870.7676" y="706.981">dpkg-reconfigure qemu-user-binfmt</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg9"><line style="stroke:#000000;stroke-width:1;" x1="863.7676" x2="905.7676" y1="754.1797" y2="754.1797"/><line style="stroke:#000000;stroke-width:1;" x1="905.7676" x2="905.7676" y1="754.1797" y2="767.1797"/><line style="stroke:#000000;stroke-width:1;" x1="864.7676" x2="905.7676" y1="767.1797" y2="767.1797"/><polygon fill="#000000" points="874.7676,763.1797,864.7676,767.1797,874.7676,771.1797,870.7676,767.1797" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="133.0532" x="870.7676" y="749.1138">mount binfmt_misc</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg10"><line style="stroke:#000000;stroke-width:1;" x1="863.7676" x2="905.7676" y1="796.3125" y2="796.3125"/><line style="stroke:#000000;stroke-width:1;" x1="905.7676" x2="905.7676" y1="796.3125" y2="809.3125"/><line style="stroke:#000000;stroke-width:1;" x1="864.7676" x2="905.7676" y1="809.3125" y2="809.3125"/><polygon fill="#000000" points="874.7676,805.3125,864.7676,809.3125,874.7676,813.3125,870.7676,809.3125" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="273.9331" x="870.7676" y="791.2466">cd /pi-gen &amp;&amp; ./build.sh -c /config</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg11"><line style="stroke:#000000;stroke-width:1;" x1="863.7676" x2="905.7676" y1="853.5781" y2="853.5781"/><line style="stroke:#