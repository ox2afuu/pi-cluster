="GMN63" data-source-line="90" id="ent0064"><path d="M4615.49,421.8069 L4615.49,492.3381 L4996.5164,492.3381 L4996.5164,431.8069 L4986.5164,421.8069 L4615.49,421.8069" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M4986.5164,421.8069 L4986.5164,431.8069 L4996.5164,431.8069 L4986.5164,421.8069" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="336.5464" x="4621.49" y="438.8738">Workers are otherwise identical. They never</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="4621.49" y="454.0066">run `sphinx` directly &#8212; they receive</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="360.0264" x="4621.49" y="469.1394">sbatch-dispatched jobs whose working directory</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="4621.49" y="484.2722">is on the shared /srv/ivalice mount.</text></g><!--link SC to L2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0037" data-link-type="association" data-source-line="56" id="lnk38"><path d="M1389.8,476.8069 C1404.83,506.4369 1438.53,563.4069 1486,588.8769 C1594.54,647.0969 1639.1,605.6969 1762,613.8769 C2277.83,648.2069 2900.81,666.8169 3107,672.3669" fill="none" id="SC-L2" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="1763" y="609.9438">6817</text></g><!--link S1 to L2--><g class="link" data-entity-1="ent0017" data-entity-2="ent0037" data-link-type="association" data-source-line="57" id="lnk39"><path d="M2105.03,476.7669 C2117.26,506.3569 2145.48,563.2669 2190,588.8769 C2269.06,634.3569 2894.77,663.0269 3106.93,671.5169" fill="none" id="S1-L2" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="