<text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="313.0664" x="1399.27" y="669.4038">Limitations &#8212; drive the federation case:</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="430.4663" x="1399.27" y="684.5366">- Only one cluster can work on an experiment at a time.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="430.4663" x="1399.27" y="699.6694">- Every experiment's artifacts live on this head's NFS;</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="367.853" x="1414.9233" y="714.8022">another cluster would need a copy (manual scp).</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="360.0264" x="1399.27" y="729.935">- No cross-team identity or sharing semantics.</text></g><!--link dalmasca to Net--><g class="link" data-entity-1="ent0021" data-entity-2="ent0020" data-link-type="dependency" data-source-line="38" id="lnk22"><path d="M1368.84,447.5669 C1373.91,453.3369 1381.26,460.8569 1389,465.8869 C1441.49,500.0469 1503.1838,522.8574 1551.4338,537.6574" fill="none" id="dalmasca-to-Net" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1557.17,539.4169,1549.7387,532.9535,1552.3898,537.9506,1547.3927,540.6018,1557.17,539.4169" style="stroke:#181818;stroke-width:1;"/></g><!--link W1 to Net--><g class="link" data-entity-1="ent0009" data-entity-2="ent0020" data-link-type="dependency" data-source-line="39" id="lnk23"><path d="M922.0813,179.9508 C922.1369,180.036 922.1928,180.1216 922.249,180.2074 C922.3612,180.3791 922.4746,180.5519 922.5889,180.7257 C923.0464,181.421 923.5206,182.1333 924.0111,182.8605 C925.9733,185.7695 928.1969,188.9181 930.6575,192.1794 C940.5,205.2244 954.135,220.0719 970,228.5969 C1294.24,402.7469 1548.76,72.2169 1789,351.0369 C1822.32,389.7069 1815.3,422.1369 1789,465.8869 C176