<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1503px" preserveAspectRatio="none" style="width:1961px;height:1503px;background:#FFFFFF;" version="1.1" viewBox="0 0 1961 1503" width="1961px" zoomAndPan="magnify"><title>Arbitrary L2 node joins the federation (no redeploy of existing clusters)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Menlo" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="615.2959" x="671.8257" y="32.9951">Arbitrary L2 node joins the federation (no redeploy of existing clusters)</text></g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="1928.9473" x="15" y="50.042"/><ellipse cx="289.4121" cy="85.9951" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="308.9844" x="134.9199" y="115.9951"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="288.9844" x="144.9199" y="137.1338">flash ivalice image onto new node's disk</text><rect fill="#FAFAFA" height="103.8125" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="446.252" x="66.2861" y="169.9639"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="274.5352" x="76.2861" y="191.1025">edit /boot/firmware/ivalice-node.conf:</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="115.5938" x="90.7354" y="205.0713">NODE_ROLE=worker</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="137.2676" x="90.7354" y="219.04">NODE_HOSTNAME=&lt;new&gt;</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="166.166" x="90.7354" y="233.0088">NODE_IP=&lt;static /24 ip&gt;</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="411.8027" x="90.7354" y="246.9775">NODE_FEDERATION_BOOTSTRAP=https://dalmasca:8443/bootstrap</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="288.9844" x="90.7354" y="260.9463">NODE_FEDERATION_TOKEN=&lt;pre-shared token&gt;</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="77.7969" x="250.5137" y="293.7764"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="57.7969" x="260.5137" y="314.915">power on</text><rect fill="#FAFAFA" height="61.9063" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="294.5352" x="142.1445" y="719.5264"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="274.5352" x="152.1445" y="740.665">append hostname + IP to the federation</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="180.6152" x="152.1445" y="754.6338">Ansible inventory in Git:</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="173.3906" x="166.5938" y="768.6025">inventory/federation.yml</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="128.3691" x="225.2275" y="801.4326"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="108.3691" x="235.2275" y="822.5713">push / PR-merge</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="316.209" x="131.3076" y="1193.1826"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="296.209" x="141.3076" y="1214.3213">sbatch a test job targeting the new node:</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="173.3906" x="155.7568" y="1228.29">sbatch -w &lt;new&gt; hostname</text><path d="M407.373,1251.1201 L407.373,1321.6514 L733.6128,1321.6514 L733.6128,1261.1201 L723.6128,1251.1201 L407.373,1251.1201" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M723.6128,1251.1201 L723.6128,1261.1201 L733.6128,1261.1201 L723.6128,1251.1201" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="266.1064" x="413.373" y="1268.187">No down time on existing clusters.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="305.2397" x="413.373" y="1283.3198">`scontrol reconfigure` is live; the new</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="297.4131" x="413.373" y="1298.4526">node slots into the existing partition</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="226.9731" x="413.373" y="1313.5854">without restarting slurmctld.</text><polygon fill="#EEEEEE" points="183.4512,1321.6514,395.373,1321.6514,407.373,1333.6514,395.373,1345.6514,183.4512,1345.6514,171.4512,1333.6514,183.4512,1321.6514" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="211.9219" x="183.4512" y="1337.4595">job returns hostname within 60s?</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="19.8677" x="151.5835" y="1331.0571">yes</text><text fill="#000000" font-family="Menlo" font-size="11" lengthAdjust="spacing" textLength="13.2451" x="407.373" y="1331.0571">no</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="258.4121" x="21" y="1355.6514"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="31" y="1376.79">node is operational in federation</text><ellipse cx="150.2061" cy="1420.6201" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="150.2061" cy="1420.6201" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="236.7383" x="310.249" y="1355.6514"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="216.7383" x="320.249" y="1376.79">inspect slurmd.log on new node</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="258.4121" x="299.4121" y="1409.6201"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="309.4121" y="1430.7588">troubleshoot munge, firewall, DNS</text><ellipse cx="428.6182" cy="1474.5889" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="428.6182" cy="1474.5889" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="1491.5889"/><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="287.3105" x="898.2681" y="347.7451"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="267.3105" x="908.2681" y="368.8838">read /boot/firmware/ivalice-node.conf</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="215.0645" x="934.3911" y="401.7139"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="195.0645" x="944.3911" y="422.8525">configure network, hostname</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="272.8613" x="905.4927" y="455.6826"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spac