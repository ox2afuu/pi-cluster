size="12" lengthAdjust="spacing" textLength="223.9629" x="1076.3726" y="578.7588">fail firstboot with clear error</text><ellipse cx="1188.354" cy="622.5889" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1188.354" cy="622.5889" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="738.6128" x2="738.6128" y1="50.042" y2="1491.5889"/><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="121.1445" x="1433.1538" y="855.4014"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="101.1445" x="1443.1538" y="876.54">pull inventory</text><rect fill="#FAFAFA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="323.4336" x="1332.0093" y="909.3701"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="303.4336" x="1342.0093" y="930.5088">render slurm.conf NodeName + PartitionName</text><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="101.1445" x="1356.4585" y="944.4775">from inventory</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="215.0645" x="1386.1938" y="977.3076"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="195.0645" x="1396.1938" y="998.4463">scp slurm.conf to all heads</text><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:0.5;" width="287.3105" x="1350.0708" y="1031.2764"/><text fill="#000000" font-family="Menlo" font-size="12" lengthAdjust="spacing" textLength="267.3105" x="1360.0708" y="1052.415">run scontrol reconfigure on each head</text><line style="stroke:#000000;stroke-width:1.5;" x1="1314.3354" x2="1314.3354" y1="50.042" y2="1491.5889"/><rect fill="#FAFAFA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#0000