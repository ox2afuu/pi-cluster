46,978.1571 C1795.2496,968.646 1803.8109,970.3135 1807.7447,980.023 C1811.7433,973.8834 1817.3364,972.712 1822.1992,979.0195 C1826.2942,971.8698 1833.2877,971.2439 1837.2983,979.1045 C1842.9577,971.5882 1848.7018,971.1231 1854.422,979.037 C1860.2684,972.0426 1866.6897,974.6305 1869.6248,982.0975 C1877.434,984.7228 1877.0182,988.9609 1872.6106,994.522 C1879.8456,1000.7843 1878.7322,1006.8372 1870.661,1011.3234 C1866.1199,1019.0279 1860.3446,1020.0202 1855.3383,1011.7702 C1850.2354,1018.6931 1842.5682,1019.9406 1838.71,1010.505 C1834.559,1020.0586 1827.392,1019.5446 1821.8611,1011.8532 C1818.5446,1018.03 1811.4558,1018.6135 1807.286,1012.8991 C1803.7266,1019.9891 1796.3395,1020.6392 1791.9822,1013.7741 C1785.2754,1022.0373 1780.1401,1019.3499 1775.2174,1011.8738 C1770.0085,1020.0216 1764.9746,1019.0415 1759.1557,1012.5428 C1754.4735,1020.7839 1749.7792,1021.1549 1743.6996,1013.9402 C1738.7095,1022.0185 1732.1514,1021.444 1727.301,1013.7945 C1719.9658,1021.4244 1714.6649,1020.7173 1710.4158,1010.8212 C1705.0028,1018.9395 1699.031,1018.3604 1693.9845,1010.4456 C1690.7052,1019.1116 1685.4903,1019.9216 1679.5195,1012.9325 C1673.7736,1019.7063 1666.8603,1019.9763 1662.9227,1011.024 C1658.2264,1018.0908 1649.6915,1018.533 1645.6939,1010.2403 C1636.6262,1009.9394 1632.1654,1006.3153 1635.8578,996.7267 C1631.1805,986.7811 1636.6222,981.0377 1646.6902,981.7748" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="14" lengthAdjust="spacing" textLength="210.7178" x="1651.64" y="999.362">L2 switch / routed subnet</text></g><g class="entity" data-qualified-name="GMN44" data-source-line="69" id="ent0045"><path d="M1924.49,767.1869 L1924.49,898.2494 L2321.5164,898.2494 L2321.5164,777.1869 L2311.5164,767.1869 L1924.49,767.1869" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2311.5164,767.1869 L2311.5164,777.1869 L2321.5164,777.1869 L2311.5164,767.1869" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><rect fill="#000000" height="3.5" width="3.5" x="1939.49" y="777.3197"/><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="360.0264" x="1946.49" y="784.2538">Two viable control-plane options (to be chosen</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="195.6665" x="1930.49" y="799.3866">based on real traffic):**</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="320.8931" x="1930.49" y="814.5194">(A) Native Slurm federation via slurmdbd,</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="1961.7966" y="829.6522">enabling `sbatch -M cluster_2`.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="375.6797" x="1930.49" y="844.785">(B) External meta-scheduler that submits to each</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="1961.7966" y="859.9178">cluster's slurmrestd over HTTP.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="367.853" x="1930.49" y="875.0506">Option A is simpler while homogeneous; option B</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="266.1064" x="1930.49" y="890.1835">scales to non-Slurm compute later.</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="80" id="ent0048"><path d="M1912.83,966.8169 L1912.83,1022.2153 A0,0 0 0 0 1912.83,1022.2153 L2325.163,1022.2153 A0,0 0 0 0 2325.163,1022.2153 L2325.163,976.8169 L2315.163,966.8169 L2061.4,966.8169 L1825.52,863.9569 L2053.4,966.8169 L1912.83,966.8169 A0,0 0 0 0 1912.83,966.8169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2315.163,966.8169 L2315.163,976.8169 L2325.163,976.8169 L2315.163,966.8169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234.7998" x="1918.83" y="983.8838">Content-hashed artifact store.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="2161.4565" y="983.8838">Models, .mfc,</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="383.5063" x="1918.83" y="999.0166">decode results keyed by sha256 so any cluster can</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="391.333" x="1918.83" y="1014.1494">hydrate without knowing where the bytes were made.</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="86" id="ent0051"><path d="M1212.57,959.2469 L1212.57,1029.7781 A0,0 0 0 0 1212.57,1029.7781 L1601.423,1029.7781 A0,0 0 0 0 1601.423,1029.7781 L1601.423,969.2469 L1591.423,959.2469 L1429.21,959.2469 L1475.2,863.7669 L1421.21,959.2469 L1212.57,959.2469 A0,0 0 0 0 1212.57,959.2469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1591.423,959.2469 L1591.423,969.2469 L1601.423,969.2469 L1591.423,959.2469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Menlo" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.5332" x="1218.57" y="976.3138">Experiment registry.</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="148.7065" x="1382.9299" y="976.3138">Row per experiment:</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="367.853" x="1218.57" y="991.4466">name, cfg hash, model hash, decode result hash,</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="367.853" x="1218.57" y="1006.5794">owner, origin cluster. Drives the "any head can</text><text fill="#000000" font-family="Menlo" font-size="13" lengthAdjust="spacing" textLength="187.8398" x="1218.57" y="1021.7122">show any experiment" UX.</text></g><!--link H1 to L2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0026" data-link-type="association" data-source-line="46" id="lnk27"><path d="M1997.0945,409.3222 C1997.3695,409.4803 1997.6511,409.6425 1997.9391,409.8086 C1998.5152,410.1407 1999.1172,410.4885 1999.7445,410.8519 C2000.9991,411.5786 2002.3552,412.3675 2003.808,413.2171 C2006.7136,414.9163 2010.0064,416.8583 2013.6496,419.0319 C2028.2224,427.7264 2048.4027,440.1259 2071.8434,455.5073 C2118.725,486.2703 2178.6488,528.9613 2232.84,577.7956 C2341.2225,675.4644 2426.675,797.7069 2339,898.2469 C2273.54,973.3069 1992.8,940.4369 1895,959.2469 C1877.79,962.5569 1859.51,966.6669 1842.08,970.8769" fill="none" id="H1-L2" style="stroke:#181818;stroke-width:1;"/></g><!--link H2 to L2--><g class="link" data-entity-1="ent0011" data-entity-2="ent0026" data-link-type="association" data-source-line="47" id="lnk28"><path d="M852.3473,655.3533 C852.6068,655.7553 852.8721,656.1655 853.1432,656.5836 C854.2274,658.256 855.404,660.0561 856.6706,661.975 C859.2038,665.8129 862.0973,670.1261 865.3333,674.8444 C878.2772,693.7175 896.7006,719.0719 919.4638,746.4094 C964.99,801.0844 1027.875,863.6919 1099,898.2469 C1308.3,999.9369 1390.07,917.5669 1619,959.2469 C1636.61,962.4469 1655.31,966.5869 1673.08,970.8769" fill="none" id="H2-L2" style="stroke:#181818;stroke-width:1;"/></g><!--link X to L2--><g class="link" data-entity-1="ent0018" data-entity-2="ent0026" data-link-type="association" data-source-line="48" id="lnk29"><path d="M2771.1913,228.6315 C2771.1245,228.9203 2771.0574,229.2096 2770.9901,229.4994 C2770.7209,230.6586 2770.4479,231.8261 2770.1712,233.0003 C2769.618,235.3487 2769.0503,237.7237 2768.4698,240.1122 C2766.1481,249.6663 2763.6225,259.4369 2761,268.5869 C2743.63,329.1769 2715,339.7069 2715,402.7369 C2715,402.7369 2715,402.7369 2715,833.7169 C2715,1018.0569 2077.06,930.3269 1895,959.2469 C1876.47,962.1869 1856.78,966.4069 1838.2