[project]
name = "ivalice-cluster-docs"
version = "0.0.0"
description = "Docs tooling for the ivaliceCluster engineering wiki (MkDocs + doc-correctness checks). Not a distributable package."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-glightbox>=0.4",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/docs/tests"]
pythonpath = ["tools/docs"]
