---
- name: Wait for SSH / connection to worker
  ansible.builtin.wait_for_connection:
    timeout: 60
    delay: 5

- name: Ensure slurmd is started and enabled
  ansible.builtin.systemd:
    name: slurmd
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for slurmd port 6818
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6818
    timeout: 60

- name: Wait for node to report healthy in sinfo (delegated to head)
  ansible.builtin.command: sinfo -N -h -n {{ inventory_hostname }} -o "%t"
  delegate_to: dalmasca
  register: _sinfo_state
  retries: 20
  delay: 3
  until: _sinfo_state.stdout is regex('^(idle|mix|alloc)\b')
  changed_when: false
  failed_when: false  # soft fail — verify role does the hard gate
