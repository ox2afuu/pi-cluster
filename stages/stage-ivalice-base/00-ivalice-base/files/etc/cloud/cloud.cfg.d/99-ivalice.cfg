network: { config: disabled }          # systemd-networkd owns networking
manage_etc_hosts: template             # regenerate /etc/hosts from template every boot
datasource_list: [ NoCloud, None ]
preserve_hostname: true                # firstboot wrote /etc/hostname
cloud_init_modules:
  - migrator
  - seed_random
  - bootcmd
  - write-files
  - update_etc_hosts
cloud_config_modules: [ runcmd ]
cloud_final_modules: [ scripts-user, final-message ]
