ClusterName=ivalice
SlurmctldHost=dalmasca(10.42.0.1)
AuthType=auth/munge
ProctrackType=proctrack/linuxproc
ReturnToService=2

SlurmctldPort=6817
SlurmdPort=6818
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

MpiDefault=pmix
JobAcctGatherType=jobacct_gather/none

# CM4 Lite: 4 cores, 8 GB RAM (~7800 MB usable). Workers are named after
# FFXII nations; Slurm accepts a comma-separated NodeName list in lieu of
# the [NN-NN] range shorthand we had when hostnames were numeric.
NodeName=archadia,rozarria,bhujerba,nabradia,kerwon CPUs=4 Sockets=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=7800 State=UNKNOWN
PartitionName=default Nodes=archadia,rozarria,bhujerba,nabradia,kerwon Default=YES MaxTime=INFINITE State=UP
