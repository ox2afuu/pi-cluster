# GitLab CI for unh/pi-cluster on the self-hosted instance.
# Runner topology, rules and artifacts: docs/infra/gitlab-ci.md.
#
#   lint, test     -> mac-local     (shared docker executor, unprivileged,
#                                    2 GB; light jobs only)
#   build, verify  -> pigen-builder (dedicated Debian 13 arm64 Lima VM,
#                                    shell executor, root via sudo)
#
# Submodules (pi-gen, sphinx-asr) use absolute public GitHub HTTPS URLs, so
# both runners fetch them anonymously over HTTPS. GIT_SUBMODULE_FORCE_HTTPS
# only rewrites SSH or relative URLs that point at this GitLab, so it is
# not needed here.

stages:
  - lint
  - test
  - build
  - verify

# One pipeline per change: merge request pipelines when an MR is open,
# branch pipelines otherwise, plus tags, schedules and manual web runs.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  GIT_SUBMODULE_STRATEGY: none

# --- light jobs on the shared mac-local runner ------------------------------

.mac-local-python:
  tags: [mac-local]
  image: python:3.12-slim
  interruptible: true
  variables:
    # The wiki generators read sphinx-asr/scripts and the sphinx-asr git
    # log; revision dates need full history. pi-gen is not needed.
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_PATHS: sphinx-asr
    GIT_SUBMODULE_DEPTH: "0"
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    UV_LINK_MODE: copy
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    NO_MKDOCS_2_WARNING: "true"
    DISABLE_MKDOCS_2_WARNING: "true"
    # git 2.47 (Debian 13) mishandles `git log --diff-filter=r`; see mkdocs.yml.
    REVDATE_STRICT: "false"
  cache:
    key: uv-python312
    paths:
      - .cache/uv
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git >/dev/null
    - git config --global --add safe.directory '*'
    - pip install --quiet uv

docs-mkdocs-strict:
  extends: .mac-local-python
  stage: lint
  script:
    - uv run --group docs mkdocs build --strict --site-dir .cache/site

shellcheck:
  stage: lint
  tags: [mac-local]
  image: debian:12-slim
  interruptible: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends shellcheck >/dev/null
    - shellcheck --version
    - find scripts stages -name '*.sh' -type f -print0 | xargs -0 shellcheck

docs-tools-tests:
  extends: .mac-local-python
  stage: test
  script:
    - uv run --group docs --with pytest pytest tools/docs/tests -q

sphinx-asr-tests:
  extends: .mac-local-python
  stage: test
  variables:
    GIT_DEPTH: "20"
    GIT_SUBMODULE_DEPTH: "1"
  script:
    - cd sphinx-asr
    - uv run --no-project --with pytest --with-requirements requirements.txt python -m pytest -q -p no:cacheprovider

# --- image build and verification on the dedicated pigen-builder runner -----

build-image:
  stage: build
  tags: [pigen]
  timeout: 3h
  resource_group: pigen
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    # Full history so `git describe` can name the pi-gen version.
    GIT_DEPTH: "0"
    GIT_SUBMODULE_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual
      allow_failure: true
  script:
    - scripts/ci/build-image.sh
    # The .img.xz (~1.1 GiB) exceeds GitLab's artifact size limit; it stays
    # on the runner and verify-image (same runner) reads out/IMAGE_PATH.
    - scripts/ci/store-image.sh out
  artifacts:
    name: "ivalice-image-$CI_COMMIT_SHORT_SHA"
    # The image (kept on the runner) carries ephemeral keys and the IC-4
    # default password: treat it as secret and never publish it.
    expose_as: image manifest
    paths:
      - out/image-manifest.json
      - out/
    expire_in: 1 week
    when: always

verify-image:
  stage: verify
  tags: [pigen]
  timeout: 1h
  resource_group: pigen
  needs:
    - job: build-image
      artifacts: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - mkdir -p out/verify
    - >-
      scripts/ci/verify-image.sh
      --manifest out/image-manifest.json
      --junit out/verify/junit.xml
      --tap out/verify/verify.tap
      "$(cat out/IMAGE_PATH)"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - out/verify/
    reports:
      junit: out/verify/junit.xml
